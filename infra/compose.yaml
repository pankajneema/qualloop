# Local development stack. Dev-only placeholder credentials; never reuse outside local/CI.
# Start with `make up` (docker compose -f infra/compose.yaml up -d --build --wait).
# Host ports are overridable: QL_PG_HOST_PORT, QL_REDIS_HOST_PORT (if 5432/6379 are already taken).
name: qualloop

x-api-env: &api-env
  QL_ENV: local
  # Compose network (fixed subnet below): the web container proxying /api/v1 is the trusted hop (A-106).
  QL_TRUSTED_PROXIES: 172.29.0.0/24
  QL_LOG_LEVEL: ${QL_LOG_LEVEL:-INFO}
  QL_DATABASE_URL: postgresql+psycopg://qualloop_app:qualloop_app@postgres:5432/qualloop
  QL_REDIS_URL: redis://qualloop_app:${QL_REDIS_PASSWORD:-qualloop-redis-dev-only}@redis:6379/0
  QL_PUBLIC_BASE_URL: http://localhost:3000
  QL_S3_ENDPOINT_URL: http://s3:8333
  QL_S3_PUBLIC_ENDPOINT_URL: ${QL_S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
  QL_S3_BUCKET_FILES: ${QL_S3_BUCKET_FILES:-qualloop-files}
  QL_S3_BUCKET_QUARANTINE: ${QL_S3_BUCKET_QUARANTINE:-qualloop-quarantine}
  QL_S3_ACCESS_KEY: ${QL_S3_ACCESS_KEY:-qualloop-dev}
  QL_S3_SECRET_KEY: ${QL_S3_SECRET_KEY:-change-me-local-only}
  QL_SMTP_HOST: mailpit
  QL_SMTP_PORT: "1025"
  QL_CLAMAV_HOST: clamav
  QL_CLAMAV_PORT: "3310"

services:
  postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres-dev-only}
    ports:
      - "127.0.0.1:${QL_PG_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d qualloop"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
    # ACL file rendered at start from infra/redis/users.acl.tmpl (default user off, AUTH required, INV-SEC-08).
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      QL_REDIS_PASSWORD: ${QL_REDIS_PASSWORD:-qualloop-redis-dev-only}
      REDISCLI_AUTH: ${QL_REDIS_PASSWORD:-qualloop-redis-dev-only}
    ports:
      - "127.0.0.1:${QL_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ./redis/entrypoint.sh:/entrypoint.sh:ro
      - ./redis/users.acl.tmpl:/acl/users.acl.tmpl:ro
    healthcheck:
      # authenticated as the app user (the default user is disabled)
      test: ["CMD-SHELL", "redis-cli --user qualloop_app --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # SeaweedFS (S3 API on :8333): maintained, free. Dev/CI only; staging/prod use cloud object storage.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      QL_S3_ACCESS_KEY: ${QL_S3_ACCESS_KEY:-qualloop-dev}
      QL_S3_SECRET_KEY: ${QL_S3_SECRET_KEY:-change-me-local-only}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3data:/data
      - ./s3/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      # S3 gateway answers 403 to anonymous requests once it is up; the master answers 200 when the cluster is ready.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/1.1 403'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  s3-init:
    image: amazon/aws-cli@sha256:97cc5f847898f54432492c128408c62e0df2153d9ad36573be8e5a03826123b0
    depends_on:
      s3:
        condition: service_healthy
    environment:
      QL_S3_ACCESS_KEY: ${QL_S3_ACCESS_KEY:-qualloop-dev}
      QL_S3_SECRET_KEY: ${QL_S3_SECRET_KEY:-change-me-local-only}
      QL_S3_ENDPOINT_URL: http://s3:8333
    volumes:
      - ./s3/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    # ClamAV clamd (ADR-011, human decision A-47). Dev/CI only; clamd answers PING only after signatures are loaded.
    # Debian variant: multi-arch (amd64 + arm64). Signatures are cached in a volume; first start needs network.
    image: clamav/clamav:1.5.4-debian@sha256:9bb8712a50f0e75166e936c452cd82dd5e5be0b85586598930b5bbb84a99a578
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  migrate:
    image: qualloop-api:dev
    build:
      context: ../api
      target: dev
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-env
      # The owner credential (can alter RLS) exists only in this one-shot migration service.
      QL_DATABASE_URL_OWNER: postgresql+psycopg://qualloop_owner:qualloop_owner@postgres:5432/qualloop
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: qualloop-api:dev
    build:
      context: ../api
      target: dev
    environment: *api-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../api/app:/app/app
      - ../api/alembic:/app/alembic
      - ../api/seeds:/app/seeds
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    image: qualloop-api:dev
    command: ["dramatiq", "app.worker"]
    environment: *api-env
    volumes: &api-code
      - ../api/app:/app/app
      - ../api/alembic:/app/alembic
      - ../api/seeds:/app/seeds
    depends_on: &worker-deps
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  dispatcher:
    image: qualloop-api:dev
    command: ["python", "-m", "app.dispatcher"]
    environment: *api-env
    volumes: *api-code
    depends_on: *worker-deps

  scheduler:
    image: qualloop-api:dev
    command: ["python", "-m", "app.scheduler"]
    environment: *api-env
    volumes: *api-code
    depends_on: *worker-deps

  web:
    build:
      context: ../web
      target: dev
    environment:
      NEXT_PUBLIC_DEFAULT_LOCALE: en
      QL_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../web/src:/app/src
      - ../web/messages:/app/messages
      - ../web/public:/app/public
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  pgdata:
  s3data:
  clamdata:
