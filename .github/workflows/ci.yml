name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.10"
  PNPM_VERSION: "10.34.6"

jobs:
  api-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - name: pip-audit
        run: uv run pip-audit --skip-editable

  api-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env: { POSTGRES_PASSWORD: ci-postgres-only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "/mailpit readyz" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      QL_ENV: local  # the suite tests local-only behaviour (seed, /docs); tests/__init__.py also defaults to local
      PGPASSWORD: ci-postgres-only
      QL_DATABASE_URL: postgresql+psycopg://qualloop_app:qualloop_app@localhost:5432/qualloop_test
      QL_TEST_DATABASE_URL: postgresql+psycopg://qualloop_app:qualloop_app@localhost:5432/qualloop_test
      QL_TEST_DATABASE_URL_OWNER: postgresql+psycopg://qualloop_owner:qualloop_owner@localhost:5432/qualloop_test
      QL_REDIS_PASSWORD: ci-redis-only
      QL_REDIS_URL: redis://qualloop_app:ci-redis-only@localhost:6379/0
      QL_REDIS_WORKER_PASSWORD: ci-redis-worker-only
      QL_S3_ENDPOINT_URL: http://localhost:8333
      QL_SMTP_HOST: localhost
      QL_SMTP_PORT: "1025"
      QL_CLAMAV_HOST: localhost
      QL_CLAMAV_PORT: "3310"
      QL_S3_ACCESS_KEY: ci-s3-access
      QL_S3_SECRET_KEY: ci-s3-only-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: { version: "${{ env.UV_VERSION }}" }
      - name: Start ClamAV (signatures download in the background)
        run: |
          docker run -d --name clamav -p 3310:3310 \
            clamav/clamav:1.5.4-debian@sha256:9bb8712a50f0e75166e936c452cd82dd5e5be0b85586598930b5bbb84a99a578
      - name: Start Redis with ACL (default user disabled, INV-SEC-08)
        run: |
          docker run -d --name redis -p 6379:6379 -e QL_REDIS_PASSWORD -e QL_REDIS_WORKER_PASSWORD -e REDISCLI_AUTH="$QL_REDIS_PASSWORD" \
            -v "$GITHUB_WORKSPACE/infra/redis/entrypoint.sh:/entrypoint.sh:ro" \
            -v "$GITHUB_WORKSPACE/infra/redis/users.acl.tmpl:/acl/users.acl.tmpl:ro" \
            --health-cmd "redis-cli --user qualloop_app --no-auth-warning ping | grep -q PONG" \
            --health-interval 5s --health-timeout 3s --health-retries 20 \
            --entrypoint /bin/sh \
            redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f /entrypoint.sh
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' redis)" = healthy ] && exit 0
            sleep 2
          done
          docker logs redis
          exit 1
      - run: uv sync --frozen
      - name: Start S3 (SeaweedFS) and create buckets
        run: |
          docker run -d --name s3 -p 8333:8333 -e QL_S3_ACCESS_KEY -e QL_S3_SECRET_KEY \
            -v "$GITHUB_WORKSPACE/infra/s3/entrypoint.sh:/entrypoint.sh:ro" --entrypoint /bin/sh \
            chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d /entrypoint.sh
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/ || true)
            [ "$code" = 403 ] && break
            sleep 2
          done
          docker run --rm --network host -e QL_S3_ACCESS_KEY -e QL_S3_SECRET_KEY -e QL_S3_ENDPOINT_URL \
            -v "$GITHUB_WORKSPACE/infra/s3/init.sh:/init.sh:ro" --entrypoint /bin/sh \
            amazon/aws-cli@sha256:97cc5f847898f54432492c128408c62e0df2153d9ad36573be8e5a03826123b0 /init.sh
      - name: Create roles and databases
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ../infra/postgres/init/01-roles.sql
      - name: Migrations up / down / up
        # The owner credential is scoped to this step only; runtime/test processes do not get it.
        env:
          QL_DATABASE_URL_OWNER: postgresql+psycopg://qualloop_owner:qualloop_owner@localhost:5432/qualloop_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Wait for ClamAV (signatures loaded)
        run: |
          for _ in $(seq 1 90); do
            [ "$(docker exec clamav /usr/local/bin/clamdcheck.sh 2>/dev/null || true)" = "Clamd is up" ] && exit 0
            sleep 5
          done
          docker logs clamav
          exit 1
      - name: Tests with coverage gate (75% overall)
        run: uv run pytest
      - name: Coverage gate for app/core (90%)
        run: uv run coverage report --include='app/core/*' --fail-under=90

  web-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: web/.nvmrc, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm eslint .
      - run: pnpm prettier --check .
      - run: pnpm tsc --noEmit

  web-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: web/.nvmrc, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run
      - run: pnpm audit --prod

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks (git history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            git /repo --no-banner --redact

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: api image
        run: docker build --target runtime --build-arg GIT_SHA=${{ github.sha }} -t qualloop-api:local api
      - name: web image
        run: docker build --target runtime -t qualloop-web:local web
      - name: Trivy image scan (HIGH/CRITICAL, fixable)
        run: |
          for img in qualloop-api:local qualloop-web:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet "$img"
          done

  e2e:
    # Full stack + both Playwright projects (desktop-1440, phone-360); runs on main.
    if: github.ref == 'refs/heads/main'
    needs: [api-test, web-test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QL_REDIS_WORKER_PASSWORD: ci-redis-worker-only  # CI-only; compose passes it to redis and the worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: web/.nvmrc, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - name: Start the full stack
        run: docker compose -f infra/compose.yaml up -d --build --wait
      - name: Migrate (idempotent; also ran as the migrate service)
        run: docker compose -f infra/compose.yaml run --rm migrate
      - name: Seed demo data, run twice to prove idempotency
        run: |
          docker compose -f infra/compose.yaml run --rm api python -m seeds.demo
          docker compose -f infra/compose.yaml run --rm api python -m seeds.demo
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Warm up web routes (dev server compiles on first hit)
        run: infra/scripts/warm_web.sh
      - run: pnpm exec playwright test
        working-directory: web
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/compose.yaml logs --no-color --tail=200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: playwright-report, path: web/playwright-report, if-no-files-found: ignore }
