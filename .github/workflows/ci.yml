name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.10"
  PNPM_VERSION: "10.34.6"

jobs:
  api-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - name: pip-audit
        run: uv run pip-audit --skip-editable

  api-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env: { POSTGRES_PASSWORD: ci-postgres-only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      minio:
        # dev/CI-only legacy build (official minio images are no longer published on Docker Hub)
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
        env:
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-only-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/live" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: ci-postgres-only
      QL_DATABASE_URL: postgresql+psycopg://qualloop_app:qualloop_app@localhost:5432/qualloop_test
      QL_DATABASE_URL_OWNER: postgresql+psycopg://qualloop_owner:qualloop_owner@localhost:5432/qualloop_test
      QL_TEST_DATABASE_URL: postgresql+psycopg://qualloop_app:qualloop_app@localhost:5432/qualloop_test
      QL_TEST_DATABASE_URL_OWNER: postgresql+psycopg://qualloop_owner:qualloop_owner@localhost:5432/qualloop_test
      QL_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv sync --frozen
      - name: Create roles and databases
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ../infra/postgres/init/01-roles.sql
      - name: Migrations up / down / up
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests with coverage gate (75% overall)
        run: uv run pytest

  web-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: web/.nvmrc, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm eslint .
      - run: pnpm prettier --check .
      - run: pnpm tsc --noEmit

  web-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: web/.nvmrc, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run
      - run: pnpm audit --prod

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: gitleaks (git history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            git /repo --no-banner --redact

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: api image
        run: docker build --target runtime --build-arg GIT_SHA=${{ github.sha }} -t qualloop-api:local api
      - name: web image
        run: docker build --target runtime -t qualloop-web:local web
      - name: Trivy image scan (HIGH/CRITICAL, fixable)
        run: |
          for img in qualloop-api:local qualloop-web:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet "$img"
          done

  e2e:
    # Smoke only at P00; runs on main.
    if: github.ref == 'refs/heads/main'
    needs: [api-test, web-test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: web/.nvmrc, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - name: Start stack
        run: docker compose -f infra/compose.yaml up -d --build --wait
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm exec playwright test
        working-directory: web
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/compose.yaml logs --no-color --tail=200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: playwright-report, path: web/playwright-report, if-no-files-found: ignore }
