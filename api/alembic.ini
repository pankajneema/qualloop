[alembic]
script_location = %(here)s/alembic
# alembic/ is added to sys.path so migrations can `from helpers import ...` (the directory name
# clashes with the alembic package, so it cannot be imported as `alembic.helpers`).
prepend_sys_path = . alembic
path_separator = space
# The URL is not set here: env.py reads QL_DATABASE_URL_OWNER (migrations run as qualloop_owner).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
